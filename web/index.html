<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ec" />
    <link rel="icon" type="image/png" href="./cet-logo-cropped.png" />
    <script>
      (function () {
        var MAIN = 'cet4-sprint/v1';
        var REG = 'cet4-sprint/profiles/v1';
        var PRE = 'cet4-sprint/profile/';
        try {
          var reg = JSON.parse(localStorage.getItem(REG) || 'null');
          if (!reg || !Array.isArray(reg.items) || !reg.items.length) {
            var id = 'p-' + Date.now().toString(36);
            var existing = localStorage.getItem(MAIN);
            reg = { active: id, items: [{ id: id, name: '我的档案', createdAt: Date.now() }] };
            localStorage.setItem(PRE + id, existing || '{}');
            localStorage.setItem(REG, JSON.stringify(reg));
            if (!existing) localStorage.setItem(MAIN, '{}');
            return;
          }
          var active = reg.items.filter(function (p) { return p.id === reg.active; })[0] || reg.items[0];
          if (!active) return;
          if (active.id !== reg.active) {
            reg.active = active.id;
            localStorage.setItem(REG, JSON.stringify(reg));
          }
          var snapshot = localStorage.getItem(PRE + active.id);
          if (!localStorage.getItem(MAIN) && snapshot) localStorage.setItem(MAIN, snapshot);
          if (!snapshot) localStorage.setItem(PRE + active.id, localStorage.getItem(MAIN) || '{}');
        } catch (e) { /* ignore */ }
      })();
    </script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('cet4-sprint/v1');
          var s = raw ? JSON.parse(raw) : {};
          var mode = (s.settings || {}).theme || 'auto';
          var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* ignore */ }
      })();
    </script>
    <title>四级冲刺 · CET-4 Sprint</title>
    <script src="./legacy/words-core.js"></script>
    <script src="./legacy/freq.js"></script>
    <script src="./legacy/content.js"></script>
    <script src="./legacy/reading-extra.js"></script>
    <script src="./legacy/translation.js"></script>
    <script src="./legacy/writing.js"></script>
    <script src="./legacy/word-extras.js"></script>
    <script src="./legacy/papers/bundle.js"></script>
    <script src="./legacy/core.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
